<script>
// Theme toggle
(function() {
    var toggle = document.querySelector('.theme-toggle');
    if (!toggle) return;

    var resolved = function() {
        var current = document.documentElement.getAttribute('data-theme');
        if (!current) {
            current = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        return current;
    };

    // The button ships as aria-pressed="false" because the served HTML is
    // theme-agnostic — the pre-paint script in head.html picks the theme after
    // the markup is written. Sync the state here, and on every click.
    var announce = function(theme) {
        toggle.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
        toggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    };
    announce(resolved());

    toggle.addEventListener('click', function() {
        var next = resolved() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        announce(next);
    });
})();

// Reading progress bar (only on post pages)
(function() {
    var bar = document.getElementById('progressBar');
    if (!bar || !document.querySelector('.post-content')) return;
    window.addEventListener('scroll', function() {
        var scrollTop = window.scrollY;
        var docHeight = document.documentElement.scrollHeight - window.innerHeight;
        if (docHeight > 0) {
            bar.style.width = (scrollTop / docHeight * 100) + '%';
        }
    });
})();

// Footnote enhancement: build sidenotes on wide viewports, and on every
// viewport make the marker click do its own smooth scroll. The default
// browser anchor jump is unreliable on image-heavy posts because images
// continue to load after the scroll begins, shifting the target.
(function() {
    var init = function() {
        var postContent = document.querySelector('.post-content');
        var footnotesSection = document.querySelector('.footnotes');
        if (!postContent || !footnotesSection) return;

        var refs = postContent.querySelectorAll('sup[id^="fnref"] a');
        if (!refs.length) return;

        var footnotesOl = footnotesSection.querySelector('ol');
        if (!footnotesOl) return;

        // Build entry list: one per footnote marker, including a reference
        // to the bottom-of-post <li> for fallback navigation on narrow widths.
        var entries = [];
        refs.forEach(function(ref) {
            var href = ref.getAttribute('href');
            if (!href) return;
            var li = document.getElementById(href.replace('#', ''));
            if (!li) return;
            var sup = ref.closest('sup');
            if (!sup) return;
            entries.push({ ref: ref, sup: sup, li: li, aside: null });
        });
        if (!entries.length) return;

        // Wide viewports get sidenotes laid out in the right margin.
        if (window.innerWidth >= 1100) {
            entries.forEach(function(entry) {
                var aside = document.createElement('aside');
                aside.className = 'sidenote';

                var numSpan = document.createElement('span');
                numSpan.className = 'sidenote__number';
                numSpan.textContent = entry.ref.textContent + '.';
                aside.appendChild(numSpan);

                var clone = entry.li.cloneNode(true);
                clone.removeAttribute('id');
                clone.querySelectorAll('.reversefootnote').forEach(function(rl) { rl.remove(); });

                var ps = clone.querySelectorAll('p');
                if (ps.length) {
                    ps.forEach(function(p) {
                        aside.appendChild(document.createTextNode(' '));
                        while (p.firstChild) aside.appendChild(p.firstChild);
                    });
                } else {
                    aside.appendChild(document.createTextNode(' '));
                    while (clone.firstChild) aside.appendChild(clone.firstChild);
                }

                postContent.appendChild(aside);
                entry.aside = aside;
            });
            postContent.classList.add('has-sidenotes');

            // Position each sidenote next to its reference paragraph, pushing
            // later notes down to avoid overlap. Done after window.load so
            // paragraph offsets account for fully-loaded images.
            var position = function() {
                var lastBottom = 0;
                entries.forEach(function(entry) {
                    if (!entry.aside) return;
                    var paragraph = entry.sup.closest('p') || entry.sup.parentElement;
                    var top = paragraph.offsetTop;
                    if (top < lastBottom + 8) top = lastBottom + 8;
                    entry.aside.style.top = top + 'px';
                    lastBottom = top + entry.aside.offsetHeight;
                });
            };
            position();

            var resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(position, 150);
            });

            // Lazy-loaded images below the fold continue landing after
            // window.load, each one pushing later paragraphs down and
            // leaving previously-positioned sidenotes anchored to stale
            // offsets. Re-run position() whenever the post-content box
            // resizes. Debounced so the callback fires once per burst.
            if (window.ResizeObserver) {
                var roTimer;
                var ro = new ResizeObserver(function() {
                    clearTimeout(roTimer);
                    roTimer = setTimeout(position, 100);
                });
                ro.observe(postContent);
            }
        }

        // Marker click: smooth-scroll to whichever target is currently
        // visible. On wide viewports that's the sidenote; on narrow ones
        // (or after a resize down) it's the bottom-of-post footnote li.
        // Lazy-loaded images further down the page can load mid-scroll and
        // push the target down, so we re-scroll on a short interval until
        // the target is actually in view (or until we give up).
        var scrollToTarget = function(target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            var attempts = 0;
            var settle = setInterval(function() {
                attempts++;
                var rect = target.getBoundingClientRect();
                var inView = rect.top >= 0 && rect.bottom <= window.innerHeight;
                if (inView || attempts >= 8) {
                    clearInterval(settle);
                    return;
                }
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 400);
        };

        entries.forEach(function(entry) {
            entry.ref.addEventListener('click', function(e) {
                var target = (entry.aside && entry.aside.offsetParent !== null)
                    ? entry.aside
                    : entry.li;
                e.preventDefault();
                target.classList.remove('sidenote--flash');
                // Force reflow so the animation restarts on repeat clicks.
                void target.offsetWidth;
                target.classList.add('sidenote--flash');
                scrollToTarget(target);
            });
        });
    };

    // Defer until images have loaded; otherwise paragraph.offsetTop is
    // measured against a too-short page and sidenotes land in the wrong place.
    if (document.readyState === 'complete') {
        init();
    } else {
        window.addEventListener('load', init);
    }
})();

// Blockquote attribution detection
(function() {
    var quotes = document.querySelectorAll('blockquote');
    quotes.forEach(function(bq) {
        var lastP = bq.querySelector('p:last-child');
        if (!lastP) return;
        var text = lastP.textContent.trim();
        if (text.charAt(0) === '\u2014' || text.substring(0, 2) === '--') {
            lastP.classList.add('blockquote-attribution');
        }
    });
})();

// Scroll-linked header shrink
(function() {
    var header = document.querySelector('.site-header');
    if (!header) return;
    var compact = false;
    var ticking = false;

    window.addEventListener('scroll', function() {
        if (!ticking) {
            requestAnimationFrame(function() {
                if (window.scrollY > 100 && !compact) {
                    header.classList.add('header--compact');
                    compact = true;
                } else if (window.scrollY <= 100 && compact) {
                    header.classList.remove('header--compact');
                    compact = false;
                }
                ticking = false;
            });
            ticking = true;
        }
    });
})();

// About page "Ink Cursor" mouse animation
(function() {
    var area = document.getElementById('about-ink-area');
    if (!area) return;

    // Desktop only
    if (!window.matchMedia('(hover: hover)').matches) return;

    // Respect reduced motion
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var lastTime = 0;
    area.addEventListener('mousemove', function(e) {
        var now = Date.now();
        if (now - lastTime < 30) return;
        lastTime = now;

        var dot = document.createElement('div');
        dot.className = 'ink-dot';
        var size = 2 + Math.random() * 3;
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        dot.style.left = e.clientX - size / 2 + 'px';
        dot.style.top = e.clientY - size / 2 + 'px';
        document.body.appendChild(dot);

        dot.addEventListener('animationend', function() {
            dot.remove();
        });
    });
})();

// Site search (only on /search/). Queries the Pagefind index that
// scripts/build_search_index.sh writes to /pagefind/ after the Jekyll build.
// pagefind.js is generated code, not a vendored dependency: it ships with the
// index it reads and is rebuilt with it.
(function() {
    var resultsEl = document.getElementById('search-results');
    if (!resultsEl) return;
    var statusEl = document.getElementById('search-status');
    var form = document.querySelector('.search__form');
    var input = form.querySelector('.search__input');

    var PAGE_SIZE = 10;
    var DEBOUNCE_MS = 250;
    var timer = null;
    var latest = 0;      // ticket of the newest query; older ones discard their output
    var current = null;  // the displayed query: { query, results, shown, urls, generation }

    // ---- Loading, and recovery from failed loads ----
    //
    // Pagefind fetches index chunks and result fragments lazily, by content-
    // hashed name. A fetch can fail transiently, and Pagefind caches the
    // failure; or a deploy can delete a chunk an open tab still expects. In
    // either case the fix is to discard the instance and start a new one,
    // which rereads pagefind-entry.json (Pagefind cache-busts that request)
    // and so learns the current hashes. Each operation gets one such retry.

    var instance = null;
    var generation = 0;

    // Same folding as scripts/build_search_words.rb: lowercase, no
    // diacritics, no punctuation except the characters Pagefind keeps.
    var makeFolder = function(keep) {
        var escaped = keep.replace(/[\]\\^-]/g, '\\$&');
        var strip = new RegExp('[^\\p{L}\\p{N}' + escaped + ']+', 'gu');
        return function(text) {
            return text.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(strip, '');
        };
    };

    var configure = function(revalidate) {
        var words = fetch('/pagefind/site-words.json', revalidate ? { cache: 'no-cache' } : {})
            .then(function(response) {
                if (!response.ok) throw new Error('site-words.json: HTTP ' + response.status);
                return response.json();
            });
        return Promise.all([import('/pagefind/pagefind.js'), words]).then(function(loaded) {
            var pagefind = loaded[0];
            return pagefind.options({ excerptLength: 30 }).then(function() {
                pagefind.init();
                return { pagefind: pagefind, words: loaded[1].words, fold: makeFolder(loaded[1].keep) };
            });
        });
    };

    var track = function(promise) {
        instance = promise;
        promise.catch(function() { if (instance === promise) instance = null; });
        return promise;
    };

    var getSearch = function() {
        return instance || track(configure(false));
    };

    var restart = function() {
        generation++;
        var previous = instance || Promise.resolve(null);
        track(previous
            .then(function(search) { return search && search.pagefind.destroy(); }, function() {})
            .then(function() { return configure(true); }));
    };

    // Runs op(search, generation, isRetry). On failure, restarts Pagefind,
    // unless a concurrent operation already did, and runs op once more.
    var withSearch = function(op) {
        var attempt = function(isRetry) {
            var started = generation;
            return getSearch().then(function(search) {
                return op(search, generation, isRetry);
            }).catch(function(error) {
                if (isRetry) throw error;
                console.warn('Search: retrying after', error);
                if (started === generation) restart();
                return attempt(true);
            });
        };
        return attempt(false);
    };

    // ---- The word check ----
    //
    // When a word matches nothing, Pagefind retries with a shortened form of
    // it, so "kubernetes" matches a lone "K" and "astrb" matches every "as".
    // That is the failure that retired the DuckDuckGo box, so every word must
    // be on the site before the search runs. A word passes if an indexed word
    // starts with it (prefix matching: "astra" finds "astray", and "existin",
    // typed on the way to "existing", finds it). Failing that, a word of plain
    // letters and digits passes if Pagefind's exact mode finds it, which keeps
    // stemming ("tested" finds "tests") and, unlike the normal mode, never
    // shortens. Words with punctuation skip that second test, because exact
    // mode strips punctuation Pagefind does not keep: "C#" would pass as "c".

    var isOnSite = function(search, word) {
        var folded = search.fold(word);
        if (!folded) return Promise.resolve(true);
        for (var i = 0; i < search.words.length; i++) {
            if (search.words[i].lastIndexOf(folded, 0) === 0) return Promise.resolve(true);
        }
        if (!/^[\p{L}\p{N}]+$/u.test(folded)) return Promise.resolve(false);
        return search.pagefind.search('"' + folded + '"').then(function(exact) {
            return exact.results.length > 0;
        });
    };

    // ---- Rendering ----

    var syncUrl = function(query) {
        var url = query ? '?q=' + encodeURIComponent(query) : window.location.pathname;
        history.replaceState(null, '', url);
    };

    var quote = function(text) { return '“' + text + '”'; };

    var renderResult = function(data) {
        var article = document.createElement('article');
        article.className = 'search-result';

        var title = document.createElement('h2');
        title.className = 'search-result__title';
        var link = document.createElement('a');
        link.href = data.url;
        link.textContent = data.meta.title || data.url;
        title.appendChild(link);
        article.appendChild(title);

        if (data.meta.date) {
            var meta = document.createElement('div');
            meta.className = 'search-result__meta';
            meta.textContent = data.meta.date;
            article.appendChild(meta);
        }

        // Pagefind builds the excerpt from indexed text, which it has already
        // HTML-escaped, and wraps matches in <mark>.
        var excerpt = document.createElement('p');
        excerpt.className = 'search-result__excerpt';
        excerpt.innerHTML = data.excerpt;
        article.appendChild(excerpt);

        return article;
    };

    var loadPage = function(results, start) {
        return Promise.all(results.slice(start, start + PAGE_SIZE).map(function(r) { return r.data(); }));
    };

    // One "More results" button, reused across pages and queries.
    var more = document.createElement('button');
    more.type = 'button';
    more.className = 'search__button search-more';

    var showMore = function() {
        more.disabled = false;
        more.textContent = 'More results';
        if (current && current.shown < current.results.length) {
            resultsEl.appendChild(more);
        } else {
            more.remove();
        }
    };

    var appendPage = function(state, pages) {
        more.remove();
        pages.forEach(function(data) {
            // A retry searches afresh, and if a deploy changed the index in
            // between, the new ranking can repeat a result already shown.
            if (state.urls[data.url]) return;
            state.urls[data.url] = true;
            resultsEl.appendChild(renderResult(data));
        });
        state.shown += pages.length;
        showMore();
    };

    more.addEventListener('click', function() {
        var state = current;
        // Disabled synchronously, so a second click while the first page is
        // loading cannot request, and append, the same page again.
        if (!state || more.disabled) return;
        more.disabled = true;
        more.textContent = 'Loading…';

        withSearch(function(search, gen, isRetry) {
            if (state !== current) return null;
            // Result handles belong to the Pagefind instance that produced
            // them; after a restart, search again for fresh ones.
            var ready = (isRetry || state.generation !== gen)
                ? search.pagefind.search(state.query).then(function(fresh) {
                    state.results = fresh.results;
                    state.generation = gen;
                })
                : Promise.resolve();
            return ready.then(function() { return loadPage(state.results, state.shown); });
        }).then(function(pages) {
            if (pages && state === current) appendPage(state, pages);
        }).catch(function(error) {
            if (state !== current) return;
            console.error('Search: could not load more results:', error);
            more.disabled = false;
            more.textContent = 'Couldn’t load more results. Try again';
        });
    });

    // ---- Running a query ----

    var run = function(query) {
        var ticket = ++latest;
        current = null;
        query = query.trim();
        syncUrl(query);

        if (!query) {
            statusEl.textContent = '';
            resultsEl.replaceChildren();
            return;
        }

        var words = query.replace(/"/g, ' ').split(/\s+/).filter(Boolean);

        withSearch(function(search, gen) {
            if (ticket !== latest) return null;
            return Promise.all(words.map(function(word) {
                return isOnSite(search, word);
            })).then(function(found) {
                var missing = words.filter(function(word, i) { return !found[i]; });
                if (missing.length || ticket !== latest) return { missing: missing };
                return search.pagefind.search(query).then(function(response) {
                    return loadPage(response.results, 0).then(function(pages) {
                        return { missing: [], results: response.results, pages: pages, generation: gen };
                    });
                });
            });
        }).then(function(outcome) {
            if (!outcome || ticket !== latest) return;
            resultsEl.replaceChildren();

            if (outcome.missing.length) {
                statusEl.textContent = 'No results for ' + quote(query) + '.' +
                    (words.length > 1 ? ' Nothing on this site contains ' + outcome.missing.map(quote).join(' or ') + '.' : '');
                return;
            }

            var count = outcome.results.length;
            statusEl.textContent = count === 0
                ? 'No results for ' + quote(query) + '.'
                : count + (count === 1 ? ' result' : ' results') + ' for ' + quote(query) + '.';
            current = { query: query, results: outcome.results, shown: 0, urls: {}, generation: outcome.generation };
            appendPage(current, outcome.pages);
        }).catch(function(error) {
            if (ticket !== latest) return;
            console.error('Search failed:', error);
            statusEl.textContent = 'Search is unavailable right now. The archive lists every post.';
            resultsEl.replaceChildren();
        });
    };

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        clearTimeout(timer);
        run(input.value);
    });

    input.addEventListener('input', function() {
        clearTimeout(timer);
        timer = setTimeout(function() { run(input.value); }, DEBOUNCE_MS);
    });

    var initial = new URLSearchParams(window.location.search).get('q') || '';
    if (initial) {
        input.value = initial;
        run(initial);
    } else {
        getSearch().catch(function() {});
        input.focus();
    }
})();
</script>
