{% comment %}
    Submits to /search/, where the inline script in foot.html runs the query
    against the Pagefind index. The archive page includes this box too, so a
    search from there lands on the results page with ?q= filled in.
{% endcomment %}
<div class="search">
    <form class="search__form" action="/search/" method="get" role="search">
        <input type="search" class="search__input" placeholder="Search this site" aria-label="Search this site" name="q" autocomplete="off">
        <button class="search__button" type="submit">Search</button>
    </form>
</div>
